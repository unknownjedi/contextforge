name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Go Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/api/go.sum

      - name: Go vet
        run: |
          cd apps/api
          go vet ./...

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: apps/api

  backend-test:
    name: Go Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: contextforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/api/go.sum

      - name: Download Go modules
        run: |
          cd apps/api
          go mod download

      - name: Run Unit Tests
        run: |
          cd apps/api
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./pkg/...

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/contextforge_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd apps/api
          go test -v -race -tags=integration ./tests/integration/...

      - name: Run Cross-Project Isolation Test
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/contextforge_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd apps/api
          go test -v -race -run TestCrossProjectIsolation ./tests/integration/...

  backend-security:
    name: Go Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: apps/api/go.mod
          go-package: ./...
          working-directory: apps/api

  frontend-check:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Lint
        run: |
          cd apps/web
          npm run lint

      - name: Typecheck
        run: |
          cd apps/web
          npm run typecheck

      - name: Test
        run: |
          cd apps/web
          npm test --if-present

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: contextforge-api:test

      - name: Build Worker Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.worker
          push: false
          tags: contextforge-worker:test

      - name: Build Web Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: contextforge-web:test
