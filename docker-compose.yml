
services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension enabled
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contextforge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: contextforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contextforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Redis 7 for Asynq job queue and distributed locks
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: contextforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Go REST API Server
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: contextforge-api
    environment:
      - CF_SERVER_ENV=production
      - CF_SERVER_PORT=8080
      - CF_DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/contextforge?sslmode=disable
      - CF_REDIS_URL=redis://redis:6379/0
      - CF_AUTH_JWT_SECRET=production-secret-token-change-me-in-prod-environment-please
      - CF_AUTH_TOKEN_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - APP_BASE_URL=http://localhost:3000
      - API_BASE_URL=http://localhost:8080
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Background Ingestion Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: contextforge-worker
    environment:
      - CF_SERVER_ENV=production
      - CF_DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/contextforge?sslmode=disable
      - CF_REDIS_URL=redis://redis:6379/0
      - CF_AUTH_JWT_SECRET=production-secret-token-change-me-in-prod-environment-please
      - CF_AUTH_TOKEN_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof worker || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Next.js Web Frontend
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: contextforge-web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
